name: Temporary branch export

on:
  push:
    branches:
      - refactor/remove-model-fallback

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive branch
        run: tar -czf branch.tar.gz --exclude=branch.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fallback-branch
          path: branch.tar.gz
          retention-days: 1
