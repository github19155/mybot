name: Temporary fallback refactor runner

on:
  push:
    branches:
      - refactor/remove-model-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply final fallback cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final cleanup
        run: python scripts/remove_model_fallback_remaining.py
      - name: Verify and commit changed files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q nanobot tests
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanobot webui tests
          git commit -m 'refactor: remove model fallback UI and compatibility'
          git push origin HEAD:refactor/remove-model-fallback
