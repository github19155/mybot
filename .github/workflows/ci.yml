name: Test Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint Python
        run: uv run ruff check nanobot tests conftest.py

      - name: Test Python
        run: >-
          uv run python -m pytest
          --ignore=tests/agent/test_mcp_reconnect_crash.py
          --durations=15 --durations-min=1.0

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build -t nanobot:test .
