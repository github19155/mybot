name: Temporary fallback development

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect when triggered
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          if [ "$message" != "chore: inspect remaining fallback" ]; then
            echo "Not the inspect trigger; skipping."
            exit 0
          fi
          echo '=== MODEL FALLBACK RESIDUALS ==='
          git grep -n -I -E 'fallback_models|fallbackModels|FallbackProvider|include_fallbacks|InlineFallbackConfig|FallbackCandidate|fallback_model_observer|build_webui_fallback_model_observer|fallbackModelName|model_call_order|modelCallOrder|update_model_call_order|onChangeCallOrder|orderSaving|migrationSaving|onMigrate|turn_model_updated' -- . ':!nanobot/web/dist/**' || true
          echo '=== CALL ORDER REFERENCES ==='
          git grep -n -I -E 'callOrder|call order|model configuration.*migrat|migrate_model_configurations|migrateModel' -- nanobot webui tests docs README.md || true
