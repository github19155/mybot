name: Temporary fallback development

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  apply-final:
    if: "${{ github.event.head_commit.message == 'clean final call order remnants' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final call-order remnants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('webui/src/tests/app-layout.test.tsx')
          text = path.read_text()
          text = text.replace('    expect(screen.queryByText("Model call order")).not.toBeInTheDocument();\n', '')
          old = 'screen.getByTestId("model-call-order-row-primary")'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected app-layout selector count: {text.count(old)}')
          path.write_text(text.replace(old, 'screen.getByTestId("model-preset-row-primary")', 1))

          path = Path('webui/src/tests/thread-shell.test.tsx')
          text = path.read_text()
          old = 'it("switches through every named preset while preserving call-order priority", async () => {'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected thread-shell title count: {text.count(old)}')
          path.write_text(text.replace(old, 'it("switches through every named preset while keeping the active preset first", async () => {', 1))

          obsolete = {
              'callOrder', 'primary', 'fallbackNumber', 'addToOrder',
              'convertTitle', 'convertHelp', 'converting', 'convertAction',
              'dragToReorder', 'moveUp', 'moveDown', 'removeFromOrder',
              'inCallOrder', 'disabled', 'noPresets', 'noPresetsHelp',
          }
          for path in Path('webui/src/i18n/locales').glob('*/common.json'):
              lines = path.read_text().splitlines(True)
              kept = []
              for line in lines:
                  stripped = line.lstrip()
                  if any(stripped.startswith(f'"{key}":') for key in obsolete):
                      continue
                  kept.append(line)
              path.write_text(''.join(kept))
              json.loads(path.read_text())
          PY
      - name: Verify and commit cleanup
        run: |
          set -euo pipefail
          git diff --check
          if grep -R -n -I -i -E 'call order|model-call-order|call-order|"callOrder"|"inCallOrder"|"fallbackNumber"|"addToOrder"|"convertTitle"|"convertHelp"|"dragToReorder"|"removeFromOrder"|"noPresetsHelp"' webui/src nanobot tests docs README.md; then
            echo 'legacy call-order residue remains'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/src
          git commit -m 'chore: remove model call-order remnants'
          git push origin HEAD:refactor/remove-model-fallback

  python-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - run: uv sync --all-extras --dev
      - name: Capture targeted Python results
        run: |
          mkdir -p _targeted_logs
          set +e
          uv run ruff check nanobot tests conftest.py > _targeted_logs/ruff.txt 2>&1
          echo $? > _targeted_logs/ruff.exit
          uv run python -m pytest -q \
            tests/agent/test_model_runtime_resolver.py \
            tests/agent/test_runtime_refresh.py \
            tests/agent/test_dream_control_plane.py \
            tests/agent/test_runtime_resolution_integration.py \
            tests/agent/test_onboard_logic.py \
            tests/providers/test_custom_thinking_style.py \
            tests/providers/test_llm_usage_observer.py \
            tests/providers/test_provider_retry.py \
            tests/utils/test_webui_turn_helpers.py \
            tests/webui/test_settings_api.py \
            tests/webui/test_settings_routes.py > _targeted_logs/pytest.txt 2>&1
          echo $? > _targeted_logs/pytest.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: python-targeted-logs
          path: _targeted_logs

  webui-targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Capture targeted WebUI results
        run: |
          mkdir -p ../_webui_logs
          set +e
          bun run lint > ../_webui_logs/lint.txt 2>&1
          echo $? > ../_webui_logs/lint.exit
          bun run test > ../_webui_logs/test.txt 2>&1
          echo $? > ../_webui_logs/test.exit
          bun run build > ../_webui_logs/build.txt 2>&1
          echo $? > ../_webui_logs/build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: webui-targeted-logs
          path: _webui_logs
