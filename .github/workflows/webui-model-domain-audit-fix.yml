name: WebUI Model Domain Audit Fix

on:
  push:
    branches:
      - cleanup/webui-model-domain

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate audited repair
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          historical = subprocess.check_output(
              [
                  "git",
                  "show",
                  "4da191f4a2b98e1ebc73cb7ff59f926dd7fe7761:.github/workflows/webui-model-domain-audit-fix.yml",
              ],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = historical.index(start_marker) + len(start_marker)
          end = historical.index(end_marker, start)
          script = textwrap.dedent(historical[start:end])
          script = script.replace(
              '    "test_settings_payload_includes_dynamic_custom_provider",\n',
              "",
              1,
          )
          script = script.replace(
              '    "test_update_transcription_settings_validates_language",\n',
              "",
              1,
          )
          exec(compile(script, "webui-audit-repair", "exec"))

          tests = Path("tests/webui/test_settings_api.py")
          text = tests.read_text()
          text = text.replace(
              "from nanobot.config.schema import Config\n"
              "from nanobot.model_domain import ModelCapabilities, ModelConfig\n"
              "from nanobot.llm_usage import get_llm_usage_store\n"
              "from nanobot.llm_usage.models import LLMCallRecord\n",
              "from nanobot.config.schema import Config\n"
              "from nanobot.llm_usage import get_llm_usage_store\n"
              "from nanobot.llm_usage.models import LLMCallRecord\n"
              "from nanobot.model_domain import ModelCapabilities, ModelConfig\n",
              1,
          )
          tests.write_text(text)
          PY
          git diff --check
          git diff --stat

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Collect scoped WebUI tests
        run: >-
          uv run python -m pytest --collect-only -q
          tests/webui/test_model_settings_core_bridge.py
          tests/webui/test_settings_api.py
          tests/webui/test_settings_capabilities.py
          tests/webui/test_settings_models.py
          tests/webui/test_settings_routes.py
          tests/webui/test_settings_services.py
          tests/webui/test_settings_system.py

      - name: Run scoped WebUI tests
        run: >-
          uv run python -m pytest -q
          tests/webui/test_model_settings_core_bridge.py
          tests/webui/test_settings_api.py
          tests/webui/test_settings_capabilities.py
          tests/webui/test_settings_models.py
          tests/webui/test_settings_routes.py
          tests/webui/test_settings_services.py
          tests/webui/test_settings_system.py

      - name: Ruff scoped changes
        run: >-
          uv run ruff check
          nanobot/webui/gateway_services.py
          nanobot/webui/settings_api.py
          nanobot/webui/settings_capabilities.py
          nanobot/webui/settings_models.py
          nanobot/webui/settings_services.py
          tests/webui/test_model_settings_core_bridge.py
          tests/webui/test_settings_api.py
          tests/webui/test_settings_capabilities.py
          tests/webui/test_settings_models.py
          tests/webui/test_settings_routes.py

      - name: Basedpyright scoped modules
        run: >-
          uv run basedpyright
          nanobot/webui/gateway_services.py
          nanobot/webui/settings_api.py
          nanobot/webui/settings_capabilities.py
          nanobot/webui/settings_models.py
          nanobot/webui/settings_services.py

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nanobot/webui/settings_models.py nanobot/webui/settings_capabilities.py tests/webui/test_settings_api.py
          if git diff --cached --quiet; then
            echo "No audited changes to commit"
          else
            git commit -m "fix(webui): restore settings coverage and credential parity"
            git push origin HEAD:cleanup/webui-model-domain
          fi
