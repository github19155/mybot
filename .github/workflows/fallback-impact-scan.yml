name: Temporary fallback refactor runner

on:
  push:
    branches:
      - refactor/remove-model-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply core patch
        run: python scripts/remove_model_fallback_core.py
      - name: Commit changed files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanobot
          git commit -m 'refactor: remove core model fallback path'
          git push origin HEAD:refactor/remove-model-fallback
