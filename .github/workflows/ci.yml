name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      webui: ${{ steps.filter.outputs.webui }}
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected jobs
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          python=false
          webui=false
          docker=false

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Unable to resolve base commit; running all CI jobs."
            python=true
            webui=true
            docker=true
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

            echo "Changed files:"
            printf '  %s\n' "${changed_files[@]}"

            for path in "${changed_files[@]}"; do
              case "$path" in
                nanobot/*|tests/*|scripts/*.py|conftest.py|pyproject.toml|uv.lock|hatch_build.py|.github/workflows/ci.yml)
                  python=true
                  ;;
              esac

              case "$path" in
                webui/README.md)
                  ;;
                webui/*|.github/workflows/ci.yml)
                  webui=true
                  ;;
              esac

              case "$path" in
                Dockerfile|.dockerignore|docker/*|docker-compose*.yml|pyproject.toml|hatch_build.py|entrypoint.sh|render-config.json|scripts/install_channel_dependencies.py|webui/package.json|webui/package-lock.json|.github/workflows/ci.yml)
                  docker=true
                  ;;
              esac
            done
          fi

          {
            echo "python=$python"
            echo "webui=$webui"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"

  python:
    name: Python 3.12
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint Python
        run: uv run ruff check nanobot tests conftest.py

      - name: Test Python
        run: >-
          uv run python -m pytest
          --ignore=tests/agent/test_mcp_reconnect_crash.py
          --durations=15 --durations-min=1.0

  webui:
    name: WebUI
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  docker:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose overlays
        run: |
          docker compose -f docker-compose.yml -f docker-compose.root.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.browser.yml -f docker-compose.root.yml config >/dev/null

      - name: Build deployment image
        run: docker build -t nanobot:test .

      - name: Build browser sidecar image
        run: docker build -f docker/browser/Dockerfile -t nanobot-browser:test .
