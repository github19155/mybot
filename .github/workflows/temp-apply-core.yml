name: Temporary fallback development

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply when triggered
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          if [ "$message" != "chore: apply remaining fallback removal" ]; then
            echo "Not the apply trigger; skipping."
            exit 0
          fi
          python scripts/remove_model_fallback_remaining.py
          git diff --check
          python -m compileall -q nanobot
          echo '=== PRODUCT RESIDUALS ==='
          git grep -n -I -E 'fallback_models|fallbackModels|FallbackProvider|include_fallbacks|InlineFallbackConfig|FallbackCandidate|fallback_model_observer|build_webui_fallback_model_observer|fallbackModelName' -- nanobot webui || true
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanobot webui
          git commit -m 'refactor: remove remaining model fallback surfaces'
          git push origin HEAD:refactor/remove-model-fallback
