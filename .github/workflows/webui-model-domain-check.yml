name: WebUI Model Domain Check

on:
  push:
    branches:
      - cleanup/webui-model-domain

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/webui-model-domain
      - name: Apply exact cleanup followups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nanobot/webui/settings_api.py")
          text = path.read_text()
          old = '''    changed = bool(\n        _core_model_call(\n            core_models.update_model_configuration,\n            config,\n            query,\n            oauth_status=_oauth_provider_status,\n        )\n    )'''
          new = '''    changed = models.update_model_configuration(\n        config,\n        query,\n        oauth_status=_oauth_provider_status,\n    )'''
          if old in text:
              path.write_text(text.replace(old, new, 1))

          path = Path("nanobot/webui/settings_models.py")
          text = path.read_text()
          old = '''                "model_id": config.subagent_roles.get(name).model_id\n                if name in config.subagent_roles\n                else None,'''
          new = '''                "model_id": config.subagent_roles[name].model_id\n                if name in config.subagent_roles\n                else None,'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nanobot/webui/settings_api.py nanobot/webui/settings_models.py
            git commit -m "fix(webui): finalize canonical model settings bridge"
            git push origin HEAD:cleanup/webui-model-domain
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Collect scoped WebUI tests
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest --collect-only -q \
            tests/webui/test_model_settings_core_bridge.py \
            tests/webui/test_settings_api.py \
            tests/webui/test_settings_capabilities.py \
            tests/webui/test_settings_models.py \
            tests/webui/test_settings_routes.py \
            tests/webui/test_settings_services.py \
            tests/webui/test_settings_system.py 2>&1 | tee collect.txt
      - name: Run scoped WebUI tests
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest -q \
            tests/webui/test_model_settings_core_bridge.py \
            tests/webui/test_settings_api.py \
            tests/webui/test_settings_capabilities.py \
            tests/webui/test_settings_models.py \
            tests/webui/test_settings_routes.py \
            tests/webui/test_settings_services.py \
            tests/webui/test_settings_system.py 2>&1 | tee pytest.txt
      - name: Ruff changed Python files
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check \
            nanobot/webui/gateway_services.py \
            nanobot/webui/settings_api.py \
            nanobot/webui/settings_capabilities.py \
            nanobot/webui/settings_models.py \
            nanobot/webui/settings_services.py \
            tests/webui/test_model_settings_core_bridge.py \
            tests/webui/test_settings_api.py \
            tests/webui/test_settings_capabilities.py \
            tests/webui/test_settings_models.py \
            tests/webui/test_settings_routes.py 2>&1 | tee ruff.txt
      - name: Basedpyright changed WebUI modules
        id: pyright
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run basedpyright \
            nanobot/webui/gateway_services.py \
            nanobot/webui/settings_api.py \
            nanobot/webui/settings_capabilities.py \
            nanobot/webui/settings_models.py \
            nanobot/webui/settings_services.py 2>&1 | tee pyright.txt
      - uses: actions/upload-artifact@v4
        with:
          name: webui-model-domain-check-output
          path: |
            collect.txt
            pytest.txt
            ruff.txt
            pyright.txt
      - name: Fail on verification errors
        if: steps.pytest.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.pyright.outcome == 'failure'
        run: exit 1
