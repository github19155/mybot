name: Temporary branch export

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: read

jobs:
  export:
    if: github.event.head_commit.message == 'chore: export fallback branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive branch
        run: git archive --format=tar.gz -o branch.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fallback-branch
          path: branch.tar.gz
          retention-days: 1
