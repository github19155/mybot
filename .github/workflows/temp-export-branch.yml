name: Temporary branch export

on:
  push:
    branches:
      - refactor/remove-model-fallback

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive branch
        run: git archive --format=tar.gz -o /tmp/branch.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fallback-branch
          path: /tmp/branch.tar.gz
          retention-days: 1
