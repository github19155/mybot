name: Fallback impact scan

on:
  push:
    branches:
      - refactor/remove-model-fallback

permissions:
  contents: write

jobs:
  patch-core:
    if: github.event.head_commit.message == 'chore: run core fallback removal patch 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply core removal
        run: python scripts/remove_model_fallback_core.py
      - name: Verify patch
        run: |
          git status --short
          git diff --check
      - name: Commit core removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanobot
          git commit -m 'refactor: remove core model fallback path'
          git push origin HEAD:refactor/remove-model-fallback
