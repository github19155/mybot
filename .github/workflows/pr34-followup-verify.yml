name: PR34 Follow-up Verify

on:
  push:
    branches: [cleanup/cli-model-domain]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/cli-model-domain
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply follow-up patch
        run: python .github/scripts/pr34-model-domain-followup.py
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Scoped collection
        run: |
          set +e
          uv run pytest --collect-only -q tests/agent/test_onboard_logic.py tests/agent/tools/test_self_tool.py tests/cli/test_tui_launcher.py tests/command/test_model_command.py tests/command/test_skill_command.py tests/config/test_timezone.py tests/config/test_provider_config.py > .github/pr34-collect.txt 2>&1
          status=$?
          cat .github/pr34-collect.txt
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/pr34-collect.txt
            git commit -m 'chore: capture PR 34 collection failure [skip ci]'
            git push origin HEAD:cleanup/cli-model-domain
            exit "$status"
          fi
          rm .github/pr34-collect.txt
      - name: Main scoped pytest
        run: uv run pytest -q tests/agent/test_onboard_logic.py tests/cli/test_tui_launcher.py tests/command/test_model_command.py tests/command/test_skill_command.py tests/config/test_timezone.py tests/config/test_provider_config.py
      - name: Self Tool scoped pytest
        run: uv run pytest -q tests/agent/tools/test_self_tool.py -k 'not SubagentStatusFormatting and not InspectTaskStatuses'
      - name: Ruff
        run: |
          uv run ruff check nanobot/cli/gateway_runtime.py nanobot/cli/onboard.py nanobot/cli/provider.py nanobot/cli/runtime_config.py nanobot/cli/tui_launcher.py nanobot/command/builtin.py tests/agent/test_onboard_logic.py tests/cli/test_tui_launcher.py tests/command/test_model_command.py tests/command/test_skill_command.py tests/config/test_timezone.py tests/config/test_provider_config.py
      - name: Basedpyright
        run: |
          uv run basedpyright nanobot/cli/gateway_runtime.py nanobot/cli/onboard.py nanobot/cli/provider.py nanobot/cli/runtime_config.py nanobot/cli/tui_launcher.py nanobot/command/builtin.py tests/command/test_model_command.py tests/command/test_skill_command.py tests/config/test_timezone.py tests/config/test_provider_config.py
      - name: Verify retained tests and no legacy preset test file
        run: |
          test ! -e tests/config/test_model_presets.py
          grep -q 'test_agent_timezone_rejects_unknown_iana_name' tests/config/test_timezone.py
          grep -q 'test_agent_timezones_use_packaged_data_without_system_database' tests/config/test_timezone.py
          grep -q 'test_provider_api_type_accepts_exact_values_only' tests/config/test_provider_config.py
          grep -q 'test_provider_api_type_is_openai_only' tests/config/test_provider_config.py
          grep -q 'test_dynamic_custom_provider_rejects_builtin_provider_aliases' tests/config/test_provider_config.py
          grep -q 'find_model_usages(config, model_id)' nanobot/cli/onboard.py
          grep -q 'delete_model(config, model_id=model_id)' nanobot/cli/onboard.py
      - name: Commit verified follow-up
        run: |
          rm -f .github/scripts/pr34-model-domain-followup.py .github/workflows/pr34-followup-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(cli): protect model deletion and retain config tests'
          git push origin HEAD:cleanup/cli-model-domain
