name: WebUI Model Domain Audit Fix

on:
  push:
    branches:
      - cleanup/webui-model-domain

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited repair
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from pathlib import Path

          workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  "4da191f4a2b98e1ebc73cb7ff59f926dd7fe7761:.github/workflows/webui-model-domain-audit-fix.yml",
              ],
              text=True,
          )
          marker = "        run: |\n          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(script, "<audited-repair>", "exec"), {"__name__": "__main__"})

          path = Path("tests/webui/test_settings_api.py")
          text = path.read_text()
          lines = text.splitlines()
          tree = ast.parse(text)
          duplicate_names = {
              "test_settings_payload_includes_dynamic_custom_provider",
              "test_update_transcription_settings_validates_language",
          }
          seen: set[str] = set()
          remove: list[tuple[int, int]] = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              if node.name not in duplicate_names:
                  continue
              if node.name not in seen:
                  seen.add(node.name)
                  continue
              starts = [node.lineno, *(d.lineno for d in node.decorator_list)]
              assert node.end_lineno is not None
              remove.append((min(starts), node.end_lineno))
          keep = [True] * len(lines)
          for first, last in remove:
              for index in range(first - 1, last):
                  keep[index] = False
          text = "\n".join(line for index, line in enumerate(lines) if keep[index]) + "\n"

          provider_env_test = r'''

          def test_transcription_provider_configured_uses_provider_environment_key(
              tmp_path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              config_path = tmp_path / "config.json"
              config = Config()
              config.models["speech-provider-env"] = ModelConfig(
                  display_name="Speech provider env",
                  provider="openai",
                  model="whisper-1",
                  capabilities=ModelCapabilities(transcription=True),
              )
              config.transcription.model_id = "speech-provider-env"
              save_config(config, config_path)
              monkeypatch.setenv("OPENAI_API_KEY", "sk-provider-env")
              monkeypatch.setattr("nanobot.config.loader._current_config_path", config_path)

              payload = settings_payload()

              assert payload["transcription"]["model_id"] == "speech-provider-env"
              assert payload["transcription"]["provider"] == "openai"
              assert payload["transcription"]["model"] == "whisper-1"
              assert payload["transcription"]["provider_configured"] is True
          '''
          if "def test_transcription_provider_configured_uses_provider_environment_key(" not in text:
              text += provider_env_test
          ast.parse(text)
          path.write_text(text)
          PY

          uvx ruff check --fix tests/webui/test_settings_api.py
          git diff --check
          git diff --stat

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Collect scoped WebUI tests
        run: >-
          uv run python -m pytest --collect-only -q
          tests/webui/test_model_settings_core_bridge.py tests/webui/test_settings_api.py
          tests/webui/test_settings_capabilities.py tests/webui/test_settings_models.py
          tests/webui/test_settings_routes.py tests/webui/test_settings_services.py
          tests/webui/test_settings_system.py

      - name: Run scoped WebUI tests
        run: >-
          uv run python -m pytest -q
          tests/webui/test_model_settings_core_bridge.py tests/webui/test_settings_api.py
          tests/webui/test_settings_capabilities.py tests/webui/test_settings_models.py
          tests/webui/test_settings_routes.py tests/webui/test_settings_services.py
          tests/webui/test_settings_system.py

      - name: Ruff scoped changes
        run: >-
          uv run ruff check
          nanobot/webui/gateway_services.py nanobot/webui/settings_api.py
          nanobot/webui/settings_capabilities.py nanobot/webui/settings_models.py
          nanobot/webui/settings_services.py tests/webui/test_model_settings_core_bridge.py
          tests/webui/test_settings_api.py tests/webui/test_settings_capabilities.py
          tests/webui/test_settings_models.py tests/webui/test_settings_routes.py

      - name: Basedpyright scoped modules
        run: >-
          uv run basedpyright
          nanobot/webui/gateway_services.py nanobot/webui/settings_api.py
          nanobot/webui/settings_capabilities.py nanobot/webui/settings_models.py
          nanobot/webui/settings_services.py

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nanobot/webui/settings_models.py nanobot/webui/settings_capabilities.py tests/webui/test_settings_api.py
          git commit -m "fix(webui): restore settings coverage and runtime credential parity"
          git push origin HEAD:cleanup/webui-model-domain
