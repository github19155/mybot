# Opt-in root mode for the nanobot gateway and CLI used to administer the same
# container-root instance. It does not grant host root authority.
x-container-root: &container-root
  user: "0:0"
  environment:
    NANOBOT_RUN_AS_ROOT: "true"
  # Restore Docker's normal default capability set for a root container. This
  # does not add SYS_ADMIN or privileged mode. The base no-new-privileges option
  # remains in force, and Docker's default seccomp/AppArmor confinement remains.
  cap_drop: !reset []
  cap_add: !reset []
  volumes:
    - nanobot-container-root-data:/home/nanobot/.nanobot

services:
  nanobot-gateway:
    <<: *container-root

  nanobot-cli:
    <<: *container-root

volumes:
  nanobot-container-root-data:
    name: mybot-container-root-data