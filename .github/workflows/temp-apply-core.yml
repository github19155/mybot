name: Temporary fallback development

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  apply-final:
    if: "${{ github.event.head_commit.message == 'restore shared disabled translations' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore shared disabled translations
        run: |
          python - <<'PY'
          from pathlib import Path

          translations = {
              'en': 'Disabled',
              'es': 'Desactivado',
              'fr': 'Désactivé',
              'id': 'Nonaktif',
              'ja': '無効',
              'ko': '비활성화됨',
              'pt-BR': 'Desabilitado',
              'vi': 'Đã tắt',
              'zh-CN': '已禁用',
              'zh-TW': '已停用',
          }
          for locale, value in translations.items():
              path = Path('webui/src/i18n/locales') / locale / 'common.json'
              text = path.read_text()
              start = text.index('    "values": {')
              end = text.index('    },', start)
              block = text[start:end]
              if '"disabled":' in block:
                  continue
              enabled = block.index('      "enabled":')
              line_end = block.index('\n', enabled) + 1
              block = block[:line_end] + f'      "disabled": {value!r},\n'.replace("'", '"') + block[line_end:]
              path.write_text(text[:start] + block + text[end:])
          PY
      - name: Verify and commit translation fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path('webui/src/i18n/locales').glob('*/common.json'):
              data = json.loads(path.read_text())
              assert data['settings']['values']['disabled']
              assert 'disabled' not in data['settings']['models']
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/src/i18n/locales
          git commit -m 'fix: restore shared disabled translations'
          git push origin HEAD:refactor/remove-model-fallback

  python-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - run: uv sync --all-extras --dev
      - name: Capture targeted Python results
        run: |
          mkdir -p _targeted_logs
          set +e
          uv run ruff check nanobot tests conftest.py > _targeted_logs/ruff.txt 2>&1
          echo $? > _targeted_logs/ruff.exit
          uv run python -m pytest -q \
            tests/agent/test_model_runtime_resolver.py \
            tests/agent/test_runtime_refresh.py \
            tests/agent/test_dream_control_plane.py \
            tests/agent/test_runtime_resolution_integration.py \
            tests/agent/test_onboard_logic.py \
            tests/providers/test_custom_thinking_style.py \
            tests/providers/test_llm_usage_observer.py \
            tests/providers/test_provider_retry.py \
            tests/utils/test_webui_turn_helpers.py \
            tests/webui/test_settings_api.py \
            tests/webui/test_settings_routes.py > _targeted_logs/pytest.txt 2>&1
          echo $? > _targeted_logs/pytest.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: python-targeted-logs
          path: _targeted_logs

  webui-targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Capture targeted WebUI results
        run: |
          mkdir -p ../_webui_logs
          set +e
          bun run lint > ../_webui_logs/lint.txt 2>&1
          echo $? > ../_webui_logs/lint.exit
          bun run test > ../_webui_logs/test.txt 2>&1
          echo $? > ../_webui_logs/test.exit
          bun run build > ../_webui_logs/build.txt 2>&1
          echo $? > ../_webui_logs/build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: webui-targeted-logs
          path: _webui_logs
