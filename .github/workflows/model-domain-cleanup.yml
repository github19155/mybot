name: Model Domain Cleanup

on:
  push:
    branches: [refactor/model-domain-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-domain-v2
      - name: Apply cleanup candidate
        run: |
          python .github/scripts/apply-model-domain-cleanup.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("nanobot/agent/loop.py")
          text = path.read_text()
          pattern = re.compile(
              r"(ModelManagement\(\n\s+model_management_config,\n)"
              r"\s+runtime_resolver=self\.runtime_resolver,\n"
          )
          text, count = pattern.subn(r"\1", text, count=1)
          if count != 1:
              raise RuntimeError(f"expected one stale ModelManagement caller, found {count}")
          path.write_text(text)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff verification
        run: uv run ruff check nanobot tests conftest.py
      - name: Pytest collection
        run: uv run python -m pytest --collect-only -q
      - name: Basedpyright verification
        run: uv run basedpyright
      - name: Full pytest
        run: uv run python -m pytest
      - name: Legacy and glue diagnostics
        if: always()
        run: |
          echo '=== ModelManagement runtime_resolver callers ==='
          grep -RIn --exclude-dir=.git 'ModelManagement(\|runtime_resolver=' nanobot tests | head -200 || true
          echo '=== Legacy model identity terms ==='
          grep -RIn --exclude-dir=.git -E 'ModelPresetConfig|model_presets|modelPresets|model_preset|modelPreset|preset_name|resolve_preset|resolve_default_preset|model_preset_from_metadata|SESSION_MODEL_PRESET_METADATA_KEY|model_override|fallback_preset|transcription_provider|transcription_language' nanobot tests | head -400 || true
