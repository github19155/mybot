name: CLI Model Domain Cleanup B

on:
  push:
    branches: [cleanup/cli-model-domain]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scoped legacy sweep
        run: |
          echo '=== runtime sources ==='
          grep -RIn -E 'ModelPresetConfig|model_presets|model_preset|modelPreset|resolve_preset|resolve_default_preset|load_model_preset_catalog|normalize_preset_name' nanobot/cli nanobot/command nanobot/agent/model_presets.py nanobot/agent/tools/self.py nanobot/agent/tools/runtime_control.py || true
          echo '=== direct tests ==='
          grep -RIn -E 'ModelPresetConfig|model_presets|model_preset|modelPreset|resolve_preset|resolve_default_preset|load_model_preset_catalog|normalize_preset_name' tests/agent/test_onboard_logic.py tests/agent/tools/test_self_tool.py tests/cli/test_tui_launcher.py tests/command/test_model_command.py tests/command/test_skill_command.py tests/config/test_model_presets.py || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Target collection
        run: uv run python -m pytest --collect-only -q tests/agent/test_onboard_logic.py tests/agent/tools/test_self_tool.py tests/cli/test_tui_launcher.py tests/command/test_model_command.py tests/command/test_skill_command.py tests/config/test_model_presets.py
