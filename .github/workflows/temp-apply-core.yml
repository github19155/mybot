name: Temporary fallback development

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply test migration
        run: |
          python scripts/update_model_fallback_tests.py
          python -m compileall -q tests
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'test: align coverage with single model runtime'
          git push origin HEAD:refactor/remove-model-fallback
