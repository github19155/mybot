name: Apply Main orchestrator integration fixes

on:
  push:
    branches:
      - integration/main-pure-orchestrator

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/main-pure-orchestrator
          fetch-depth: 0
      - name: Apply focused runtime and test-contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path


          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")


          def remove_function(path: str, name: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              tree = ast.parse(text)
              node = next(
                  (item for item in tree.body if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and item.name == name),
                  None,
              )
              if node is None or node.end_lineno is None:
                  raise SystemExit(f"{path}: function not found: {name}")
              start = min([node.lineno, *(d.lineno for d in node.decorator_list)])
              lines = text.splitlines(keepends=True)
              end = node.end_lineno
              while end < len(lines) and not lines[end].strip():
                  end += 1
              del lines[start - 1:end]
              p.write_text("".join(lines), encoding="utf-8")


          # Real runtime regressions exposed by the integration run.
          replace(
              "nanobot/agent/loop.py",
              "                        msg = pending_msg\n",
              "                        routed_msg = pending_msg\n",
          )
          replace(
              "nanobot/agent/subagent.py",
              "            tools = self._build_tools(\n                workspace=root,\n                tools_config=cfg,\n",
              "            tools = self._build_tools(\n                tools_config=cfg,\n",
          )
          replace(
              "nanobot/agent/subagent.py",
              "            if name not in allowed_names or (\n                name in TOOL_MODULES\n                and type(tool).__module__ != f\"nanobot.agent.tools.{TOOL_MODULES[name]}\"\n            ):\n",
              "            if (\n                name not in allowed_names\n                or not self.permissions.tool_allowed(subject, name)\n                or (\n                    name in TOOL_MODULES\n                    and type(tool).__module__ != f\"nanobot.agent.tools.{TOOL_MODULES[name]}\"\n                )\n            ):\n",
          )
          replace(
              "nanobot/agent/tools/subagent.py",
              "        if ctx.registry is None:\n            raise RuntimeError(\"SubagentTool requires the owning system tool registry\")\n        manager.system_tools = ctx.registry\n",
              "        if ctx.registry is not None:\n            manager.system_tools = ctx.registry\n",
          )

          # Keep memory governance while making all operational guidance Worker-safe.
          replace(
              "nanobot/templates/agent/identity.md",
              "- Agent profile: {{ agent_workspace_path }}/SOUL.md and {{ agent_workspace_path }}/USER.md\n- Long-term memory: {{ agent_workspace_path }}/memory/MEMORY.md\n- History log: {{ agent_workspace_path }}/memory/history.jsonl\n",
              "- Agent profile: {{ agent_workspace_path }}/SOUL.md and {{ agent_workspace_path }}/USER.md (canonical profile state; Dream may propose changes but cannot edit them directly)\n- Long-term memory: {{ agent_workspace_path }}/memory/MEMORY.md (canonical memory state; Dream may propose changes but cannot edit it directly)\n- History log: {{ agent_workspace_path }}/memory/history.jsonl (append-only JSONL; delegate searches or inspection to a Worker)\n",
          )
          replace(
              "nanobot/templates/agent/identity.md",
              "- Agent profile: SOUL.md and USER.md\n- Long-term memory: memory/MEMORY.md\n- History log: memory/history.jsonl\n",
              "- Agent profile: SOUL.md and USER.md (canonical profile state; Dream may propose changes but cannot edit them directly)\n- Long-term memory: memory/MEMORY.md (canonical memory state; Dream may propose changes but cannot edit it directly)\n- History log: memory/history.jsonl (append-only JSONL; delegate searches or inspection to a Worker)\n",
          )
          replace(
              "nanobot/templates/agent/tool_contract.md",
              "- Use current control-plane discovery when Worker roles or capabilities matter; do not assume the Specialist list is static and do not invent unavailable query interfaces.\n",
              "- Use the Main-callable `subagent` control-plane tool with action `role.list` or `role.get` when Worker roles or capabilities matter. These actions report declared, permission-allowed, and currently available Worker tools without activating MCP connections. Do not treat `role.list` or `role.get` as standalone tools.\n",
          )
          replace(
              "nanobot/templates/agent/tool_contract.md",
              "## Authorization, Untrusted Content, and Truthfulness\n",
              "## Messaging and Media Delivery\n\n- Reply directly in the current conversation for normal text responses. Do not use the `message` tool for normal replies in the current chat.\n- Use `message` only for proactive sends, cross-channel delivery, or delivery of existing local files and media through its `media` parameter.\n- When a Worker returns generated image artifact paths, Main may use `message` with those paths in `media` during the result turn.\n\n## Authorization, Untrusted Content, and Truthfulness\n",
          )

          # Retire assertions for the old Main execution contract and assert the new split contract.
          replace(
              "tests/agent/test_context_prompt_cache.py",
              '    assert "# Tool Usage Notes" in prefix_a\n',
              '    assert "# Main Orchestration Contract" in prefix_a\n',
          )
          replace(
              "tests/agent/test_context_prompt_cache.py",
              "def test_execution_rules_in_system_prompt(tmp_path) -> None:\n    \"\"\"Execution rules should appear in the system prompt via the default templates.\"\"\"\n",
              "def test_orchestration_rules_in_system_prompt(tmp_path) -> None:\n    \"\"\"Main orchestration rules should appear via the default templates.\"\"\"\n",
          )
          replace(
              "tests/agent/test_context_prompt_cache.py",
              '    assert "clear user request" in prompt\n    assert "multi-step tasks" in prompt\n    assert "read-only discovery before writes" in prompt\n    assert "verify the result" in prompt\n',
              '    assert "# Main Orchestration Contract" in prompt\n    assert "clear user request" in prompt\n    assert "Every Worker dispatch is asynchronous" in prompt\n    assert "Main does not perform operational execution itself" in prompt\n',
          )
          replace(
              "tests/agent/test_context_prompt_cache.py",
              '    current_rule = "Treat a clear user request as authorization"\n',
              '    current_rule = "A clear user request authorizes work only within"\n',
          )
          replace(
              "tests/agent/test_context_prompt_cache.py",
              '    contract = (\n        pkg_files("nanobot") / "templates" / "agent" / "tool_contract.md"\n    ).read_text(encoding="utf-8")\n\n    assert "## Execution Rules" not in soul\n    assert "clear user request" not in soul\n    assert "clear user request" in contract\n    assert "multi-step tasks" in contract\n    assert "irreversible action needs confirmation" in contract\n',
              '    contract = (\n        pkg_files("nanobot") / "templates" / "agent" / "tool_contract.md"\n    ).read_text(encoding="utf-8")\n    worker_contract = (\n        pkg_files("nanobot") / "templates" / "agent" / "worker_execution.md"\n    ).read_text(encoding="utf-8")\n\n    assert "## Execution Rules" not in soul\n    assert "clear user request" not in soul\n    assert "clear user request" in contract\n    assert "Every Worker dispatch is asynchronous" in contract\n    assert "For multi-step work" in worker_contract\n    assert "execute through completion and verification" in worker_contract\n',
          )
          replace(
              "tests/agent/test_context_prompt_cache.py",
              '    assert "Do not use the \'message\' tool for normal replies in the current chat" in prompt\n    assert "When \'generate_image\' creates images" in prompt\n    assert "call \'message\' with the artifact paths in the \'media\' parameter" in prompt\n    assert "Wait for the tool results, then answer once" in prompt\n',
              '    assert "Do not use the `message` tool for normal replies in the current chat" in prompt\n    assert "When a Worker returns generated image artifact paths" in prompt\n    assert "use `message` with those paths in `media` during the result turn" in prompt\n    assert "Wait for the tool results, then answer once" not in prompt\n',
          )
          replace(
              "tests/agent/test_context_prompt_cache.py",
              '    assert prompt.count("Do not use the \'message\' tool for normal replies") == 1\n',
              '    assert prompt.count("Do not use the `message` tool for normal replies") == 1\n',
          )

          replace(
              "tests/agent/test_orchestrator_specialists.py",
              '    assert "Main owns the conversation" in tool_contract\n    assert "permanent `general`" in tool_contract\n    assert "Browser is a worker capability" in tool_contract\n    assert "role.list" in tool_contract\n',
              '    assert "Main is the user-facing control plane" in tool_contract\n    assert "Prefer a matching active Specialist" in tool_contract\n    assert "Use a WorkAgent" in tool_contract\n    assert "permanent General" in tool_contract\n    assert "`subagent`" in tool_contract\n    assert "`role.list`" in tool_contract\n    assert "`role.get`" in tool_contract\n    assert "Children do not create further Workers" in tool_contract\n',
          )

          replace(
              "tests/agent/test_work_agent_docs.py",
              "def test_tool_contract_defines_three_lane_worker_routing() -> None:\n",
              "def test_tool_contract_defines_worker_routing() -> None:\n",
          )
          replace(
              "tests/agent/test_work_agent_docs.py",
              '    assert "three lanes" in contract\n    assert "Specialist" in contract\n    assert "WorkAgent" in contract\n    assert "permanent `general`" in contract\n    assert "any explicit per-run override means ephemeral WorkAgent" in contract\n    assert "does not inherit General\'s persistent" in contract\n    assert "Children cannot create further Subagents" in contract\n',
              '    assert "Prefer a matching active Specialist" in contract\n    assert "Use a WorkAgent" in contract\n    assert "special tools, prompt, model, or runtime configuration" in contract\n    assert "permanent General" in contract\n    assert "Children do not create further Workers" in contract\n',
          )

          replace(
              "tests/agent/test_workspace_scope.py",
              '    assert prompt.index("# Tool Usage Notes") < prompt.index("# Current Project")\n    assert f"Working directory: {project.resolve()}" in prompt\n    assert "Use it as the default root for project files" in prompt\n',
              '    assert prompt.index("# Main Orchestration Contract") < prompt.index("# Current Project")\n    assert f"Project scope for delegated work: {project.resolve()}" in prompt\n    assert "Preserve this scope when dispatching Workers" in prompt\n    assert "Main does not operate project files itself" in prompt\n',
          )
          replace(
              "tests/agent/test_subagent.py",
              '    assert "one root and relative SKILL.md paths" in prompt\n',
              '    assert "one root and relative `SKILL.md` paths" in prompt\n',
          )

          # These two tests assert the deliberately removed active-turn subagent injection path.
          # New-turn behavior is covered by test_subagent_result_turn_boundary.py.
          remove_function(
              "tests/agent/test_runner_injections.py",
              "test_subagent_pending_injection_is_hidden_history_and_not_merged",
          )
          remove_function(
              "tests/agent/test_runner_injections.py",
              "test_mid_turn_subagent_result_does_not_resolve_a_new_turn_route",
          )

          # Syntax-check all touched Python files without needing the project environment.
          for path in [
              "nanobot/agent/loop.py",
              "nanobot/agent/subagent.py",
              "nanobot/agent/tools/subagent.py",
              "tests/agent/test_context_prompt_cache.py",
              "tests/agent/test_orchestrator_specialists.py",
              "tests/agent/test_work_agent_docs.py",
              "tests/agent/test_workspace_scope.py",
              "tests/agent/test_subagent.py",
              "tests/agent/test_runner_injections.py",
          ]:
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
      - name: Remove temporary workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/fix-main-orchestrator-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(agent): align integration runtime and tests"
          git push origin HEAD:integration/main-pure-orchestrator
