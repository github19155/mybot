name: Temporary fallback development

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  apply-final:
    if: "${{ github.event.head_commit.message == 'fix final targeted fallback checks' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix final targeted checks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/webui/test_settings_api.py')
          text = path.read_text()
          replacements = [
              (
                  'def test_create_model_configuration_accepts_legacy_label_without_changing_call_order(',
                  'def test_create_model_configuration_activates_first_named_preset(',
              ),
              (
                  '    assert payload["agent"]["model_preset"] == "default"\n'
                  '    assert payload["agent"]["model"] == "openai/gpt-4o"\n',
                  '    assert payload["agent"]["model_preset"] == "fast-writing"\n'
                  '    assert payload["agent"]["model"] == "openai/gpt-4.1-mini"\n',
              ),
              (
                  '    assert saved.agents.defaults.model_preset is None\n'
                  '    assert saved.model_presets["fast-writing"].model == "openai/gpt-4.1-mini"\n',
                  '    assert saved.agents.defaults.model_preset == "fast-writing"\n'
                  '    assert saved.model_presets["fast-writing"].model == "openai/gpt-4.1-mini"\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected test_settings_api match count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          text = text.replace('\n\n\n\ndef test_create_model_configuration_preserves_canonical_name', '\n\ndef test_create_model_configuration_preserves_canonical_name', 1)
          path.write_text(text)

          path = Path('webui/src/components/settings/models/ModelsSettings.tsx')
          text = path.read_text()
          old = '              saving ||\n              orderSaving\n'
          new = '              saving ||\n              selectionSaving\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected ModelsSettings match count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('webui/src/tests/settings-models.test.tsx')
          text = path.read_text()
          old = 'Remove this preset from the call order before deleting it.'
          new = 'Select another preset before deleting this one.'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected settings-models text match count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify and commit fixes
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui tests
          git commit -m 'test: align model preset checks with single runtime'
          git push origin HEAD:refactor/remove-model-fallback

  python-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - run: uv sync --all-extras --dev
      - name: Capture targeted Python results
        run: |
          mkdir -p _targeted_logs
          set +e
          uv run ruff check nanobot tests conftest.py > _targeted_logs/ruff.txt 2>&1
          echo $? > _targeted_logs/ruff.exit
          uv run python -m pytest -q \
            tests/agent/test_model_runtime_resolver.py \
            tests/agent/test_runtime_refresh.py \
            tests/agent/test_dream_control_plane.py \
            tests/agent/test_runtime_resolution_integration.py \
            tests/agent/test_onboard_logic.py \
            tests/providers/test_custom_thinking_style.py \
            tests/providers/test_llm_usage_observer.py \
            tests/providers/test_provider_retry.py \
            tests/utils/test_webui_turn_helpers.py \
            tests/webui/test_settings_api.py \
            tests/webui/test_settings_routes.py > _targeted_logs/pytest.txt 2>&1
          echo $? > _targeted_logs/pytest.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: python-targeted-logs
          path: _targeted_logs

  webui-targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Capture targeted WebUI results
        run: |
          mkdir -p ../_webui_logs
          set +e
          bun run lint > ../_webui_logs/lint.txt 2>&1
          echo $? > ../_webui_logs/lint.exit
          bun run test > ../_webui_logs/test.txt 2>&1
          echo $? > ../_webui_logs/test.exit
          bun run build > ../_webui_logs/build.txt 2>&1
          echo $? > ../_webui_logs/build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: webui-targeted-logs
          path: _webui_logs
