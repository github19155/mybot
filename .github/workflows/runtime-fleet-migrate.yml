name: Runtime Fleet Migration

on:
  push:
    branches: [tmp-ignore]
    paths:
      - '.ci/runtime_fleet/**'
      - '.github/workflows/runtime-fleet-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ignore
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-runtime-fleet-v2
          fetch-depth: 0
          path: repo
      - name: Apply canonical cleanup
        working-directory: repo
        run: |
          python ../staging/.ci/runtime_fleet/patch3.py
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        working-directory: repo
        run: uv sync --all-extras --dev
      - name: Validate cleanup
        working-directory: repo
        run: |
          files=$(git diff --name-only --diff-filter=ACM | grep -E '\.py$' || true)
          if [ -n "$files" ]; then uv run ruff check $files; fi
          uv run python -m compileall -q nanobot/agent/loop.py nanobot/agent/tools/self.py nanobot/nanobot.py
      - name: Commit cleanup
        working-directory: repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(runtime): remove legacy model selectors'
          git push origin HEAD:refactor/model-runtime-fleet-v2
