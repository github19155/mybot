name: History replay investigation

on:
  push:
    branches:
      - fix/history-replay-compaction-regression

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run legacy history replay regression
        run: >-
          uv run python -m pytest
          tests/agent/test_history_replay.py::test_runner_checkpoint_keeps_current_user_as_replay_boundary
          -v
