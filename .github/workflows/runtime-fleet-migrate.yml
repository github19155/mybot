name: Runtime Fleet Migration

on:
  push:
    branches: [tmp-ignore]
    paths:
      - '.github/workflows/runtime-fleet-migrate.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-runtime-fleet-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff changed runtime scope
        run: |
          uv run ruff check \
            nanobot/providers/factory.py \
            nanobot/model_fleet.py \
            nanobot/agent/model_runtime.py \
            nanobot/agent/loop.py \
            nanobot/agent/tools/runtime_control.py \
            nanobot/agent/tools/self.py \
            nanobot/bus/runtime_events.py \
            nanobot/session/model_selection.py \
            nanobot/utils/llm_runtime.py \
            tests/agent/test_model_runtime_resolver.py \
            tests/agent/test_runtime_resolution_integration.py \
            tests/agent/test_runtime_refresh.py \
            tests/agent/test_session_model_runtime.py \
            tests/test_model_fleet.py \
            tests/agent/test_self_model_id.py
      - name: Targeted runtime fleet tests
        run: |
          uv run python -m pytest -q \
            tests/agent/test_model_runtime_resolver.py \
            tests/agent/test_runtime_resolution_integration.py \
            tests/agent/test_runtime_refresh.py \
            tests/agent/test_session_model_runtime.py \
            tests/test_model_fleet.py \
            tests/agent/test_self_model_id.py
