name: Temporary core patch

on:
  push:
    branches: [refactor/remove-model-fallback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply when triggered
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          if [ "$message" != "chore: trigger core fallback removal" ]; then
            echo "Not the trigger commit; skipping."
            exit 0
          fi
          python scripts/remove_model_fallback_core.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanobot
          git commit -m 'refactor: remove core model fallback path'
          git push origin HEAD:refactor/remove-model-fallback
